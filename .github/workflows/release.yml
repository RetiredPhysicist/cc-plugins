name: Release

on:
  push:
    branches: [main]

# Do not cancel an in-flight publish if another main push lands.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs full history to detect prior releases.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json

      # package.json pins bun@1.4.2; statusline builds from bun.lock in
      # script/changeset-publish.sh. Match ci.yml so Release does not fall
      # through to npm ci without a package-lock.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Workspaces exist so Changesets can discover plugins with package.json,
      # but each package still owns its own lockfile for CI. Install only the
      # root Changesets tooling here.
      - name: Install Changesets (root only)
        run: npm ci --workspaces=false --no-audit --no-fund

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
