name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: plugins/cc-shannon-statusline
        run: bun install --frozen-lockfile || bun install

      - name: Tests
        working-directory: plugins/cc-shannon-statusline
        run: bun test

      # The plugin installs a prebuilt dist, so a stale dist would ship stale
      # code. Rebuild and fail when the committed output differs.
      - name: Verify the committed dist matches the source
        working-directory: plugins/cc-shannon-statusline
        run: |
          bun run build
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of date; run 'bun run build' and commit the result" >&2
            git --no-pager diff --stat -- dist
            exit 1
          fi

      - name: Validate the marketplace and the plugin
        run: |
          # Not --strict: the plugin deliberately omits `version` so its version
          # is the source commit SHA, which the strict check warns about.
          npx --yes @anthropic-ai/claude-code@latest plugin validate .
          npx --yes @anthropic-ai/claude-code@latest plugin validate plugins/cc-shannon-statusline
