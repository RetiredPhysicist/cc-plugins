name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statusline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: plugins/cc-shannon-statusline
        run: bun install --frozen-lockfile || bun install

      - name: Tests
        working-directory: plugins/cc-shannon-statusline
        run: bun test

      # The plugin installs a prebuilt dist, so a stale dist would ship stale
      # code. Rebuild and fail when the committed output differs.
      - name: Verify the committed dist matches the source
        working-directory: plugins/cc-shannon-statusline
        run: |
          bun run build
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of date; run 'bun run build' and commit the result" >&2
            git --no-pager diff --stat -- dist
            exit 1
          fi

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unit tests
        working-directory: plugins/cc-shannon-mod
        run: node --test test/*.test.mjs

      - name: Mod tests
        working-directory: plugins/cc-shannon-mod
        run: npx --yes @anthropic-ai/claude-code@latest plugin test .

  bloom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unit tests
        working-directory: plugins/cc-shannon-bloom
        run: node --test test/*.test.mjs

      - name: Mod tests
        working-directory: plugins/cc-shannon-bloom
        run: npx --yes @anthropic-ai/claude-code@latest plugin test .

  atuin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unit tests
        working-directory: plugins/cc-atuin
        run: node --test test/*.test.mjs

      - name: Mod tests
        working-directory: plugins/cc-atuin
        run: npx --yes @anthropic-ai/claude-code@latest plugin test .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Not --strict: plugins here deliberately omit `version` so it tracks the
      # source commit SHA, which the strict check warns about.
      - name: Validate the marketplace and every plugin
        run: |
          npx --yes @anthropic-ai/claude-code@latest plugin validate .
          for dir in plugins/*/; do
            npx --yes @anthropic-ai/claude-code@latest plugin validate "$dir"
          done
