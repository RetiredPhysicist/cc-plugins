name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statusline:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1

      # package.json pins bun@1.4.2; `latest` overrode it, so CI and the
      # developer machine could resolve different installs from the same lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A sticky disk mounts the package cache in ~3s with no size cap, which
      # beats downloading the same tarballs on every run.
      - name: Mount the Bun package cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-bun-cache
          path: ~/.bun/install/cache

      - name: Install
        working-directory: plugins/cc-shannon-statusline
        run: bun install --frozen-lockfile

      - name: Tests
        working-directory: plugins/cc-shannon-statusline
        run: bun test

      # The plugin installs a prebuilt dist, so a stale dist would ship stale
      # code. Rebuild and fail when the committed output differs.
      - name: Verify the committed dist matches the source
        working-directory: plugins/cc-shannon-statusline
        run: |
          bun run build
          # --quiet alone only inspects tracked files, so a build that emits a
          # new or renamed chunk would pass. Compare the whole directory.
          if ! git status --porcelain -- dist | grep -q .; then
            exit 0
          fi
          echo "dist/ is out of date; run 'bun run build' and commit the result" >&2
          git status --porcelain -- dist
          git --no-pager diff --stat -- dist
          exit 1

  hooks:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `npx --yes ...@latest` ran in five separate steps, so the same large
      # CLI download happened five times per run. One install, then the local
      # binary. Unpinned on purpose: these tests exist to catch what a new
      # Claude Code breaks before a user hits it.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: cc-shannon-mod — unit tests
        working-directory: plugins/cc-shannon-mod
        run: node --test test/*.test.mjs

      - name: cc-shannon-mod — plugin tests
        working-directory: plugins/cc-shannon-mod
        run: claude plugin test .

      - name: cc-shannon-bloom — unit tests
        working-directory: plugins/cc-shannon-bloom
        run: node --test test/*.test.mjs

      - name: cc-shannon-bloom — plugin tests
        working-directory: plugins/cc-shannon-bloom
        run: claude plugin test .

      - name: cc-atuin — unit tests
        working-directory: plugins/cc-atuin
        run: node --test test/*.test.mjs

      - name: cc-atuin — plugin tests
        working-directory: plugins/cc-atuin
        run: claude plugin test .

      # Not --strict: plugins here deliberately omit `version` so it tracks the
      # source commit SHA, which the strict check warns about.
      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate .
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done
